<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hector Live</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --text: #e8eaf0; --muted: #8a90a0;
    --accent: #e0553d; --listen: #3d8be0; --think: #c9a227; --me: #243044; --him: #22262f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 20px; border-bottom: 1px solid #222632; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
         max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .me { align-self: flex-end; background: var(--me); }
  .him { align-self: flex-start; background: var(--him); }
  .msg small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .interim { opacity: .55; font-style: italic; }
  .err { align-self: center; color: #ff8a7a; font-size: 14px; }
  footer { padding: 18px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #orb { width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer;
         background: #2a2f3a; color: #fff; font-size: 15px; font-weight: 600; transition: .2s; }
  #orb.listening { background: var(--listen); box-shadow: 0 0 0 0 rgba(61,139,224,.6); animation: pulse 1.4s infinite; }
  #orb.thinking { background: var(--think); }
  #orb.speaking { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); } 100% { box-shadow: 0 0 0 22px rgba(255,255,255,0); } }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; text-align: center; }
  form { display: flex; gap: 8px; width: 100%; max-width: 760px; }
  input { flex: 1; background: var(--panel); border: 1px solid #2a2f3a; color: var(--text);
          padding: 10px 14px; border-radius: 10px; font-size: 15px; }
  form button { background: var(--panel); border: 1px solid #2a2f3a; color: var(--text);
                padding: 0 16px; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Hector <span>live voice chat</span></h1>
</header>

<div id="log"></div>

<footer>
  <button id="orb">Start</button>
  <div id="status">Press Start, then just talk. Hector answers in English and keeps listening.</div>
  <div style="color:var(--muted);font-size:12px;text-align:center">Chats with Hector are shared with Mostafa. On iPhone, turn off silent mode to hear him.</div>
  <form id="typed"><input id="text" placeholder="…or type here" autocomplete="off"><button>Send</button></form>
</footer>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log'), orb = document.getElementById('orb'), statusEl = document.getElementById('status');
const player = new Audio(); player.playsInline = true;
const SILENCE = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYyLjEyLjEwMgAAAAAAAAAAAAAA//NwwAAAAAAAAAAAAEluZm8AAAAPAAAABgAAAykAWlpaWlpaWlpaWlpaWlpaWnt7e3t7e3t7e3t7e3t7e3t7nJycnJycnJycnJycnJycnL29vb29vb29vb29vb29vb293t7e3t7e3t7e3t7e3t7e3t7/////////////////////AAAAAExhdmM2Mi4yOAAAAAAAAAAAAAAAACQCowAAAAAAAAMpEpf5vwAAAAAAAAAAAAAAAAD/80DEAAAAA0gAAAAATEFNRTQuMFVVVVVVVVVVVVVVVUxBTUU0LjBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQsRbAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUU0LjBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQMSkAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTQuMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NCxKMAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTQuMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NAxKQAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80LEowAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=';
let unlocked = false;
function unlockAudio() { if (unlocked) return; unlocked = true; player.src = SILENCE; player.play().catch(() => { unlocked = false; }); }
const lang = 'en-US';  // English only
let turn = 0, active = false, state = 'idle', history = [], rec = null, audio = null, interimEl = null;

function setState(s, msg) {
  state = s; orb.className = s;
  orb.textContent = { idle: 'Start', listening: 'Listening', thinking: 'Thinking', speaking: 'Tap to cut in' }[s];
  statusEl.textContent = msg || { idle: 'Press Start, then just talk.', listening: 'Go ahead, I\'m listening…',
    thinking: 'Thinking…', speaking: 'Speaking (tap the circle to interrupt)' }[s];
}
function add(cls, text, note) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  if (note) { const s = document.createElement('small'); s.textContent = note; d.appendChild(s); }
  if (/[؀-ۿ]/.test(text)) d.dir = 'rtl';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

// One mic session for the whole conversation. Phones won't let a page restart the mic
// without a tap, so we never stop it between turns; we just ignore what it hears while Hector talks.
let recRunning = false, everStarted = false, consumed = 0, resultsLen = 0, silenceTimer = null, lastHeard = '';

function ensureRec() {
  if (rec) return;
  rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => {
    resultsLen = e.results.length;
    if (state !== 'listening') { consumed = resultsLen; return; }   // that's Hector's own voice
    let text = '';
    for (let i = consumed; i < e.results.length; i++) text += e.results[i][0].transcript;
    lastHeard = text.trim();
    if (!lastHeard) return;
    if (!interimEl) interimEl = add('me interim', '');
    interimEl.textContent = lastHeard;
    clearTimeout(silenceTimer);                       // a short pause ends your turn
    silenceTimer = setTimeout(() => {
      consumed = resultsLen;
      if (interimEl) { interimEl.remove(); interimEl = null; }
      const said = lastHeard; lastHeard = '';
      if (said && state === 'listening') talk(said);
    }, 1000);
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      active = false;
      setState('idle', everStarted ? 'Tap Start to keep talking.' : 'Microphone blocked. Allow it in the address bar, then press Start.');
    }
    else if (e.error === 'audio-capture') { active = false; setState('idle', 'No microphone found, or another tab is using it. Close other Hector tabs and press Start.'); }
    else if (e.error === 'network') { active = false; setState('idle', 'Speech recognition could not reach the internet. Check your connection, or type below.'); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') statusEl.textContent = 'Mic issue: ' + e.error;
  };
  rec.onaudiostart = () => { everStarted = true; if (state === 'listening') statusEl.textContent = "Go ahead, I'm listening… (mic is on)"; };
  rec.onend = () => {                                  // the browser closed the session: reopen it if we can
    recRunning = false; rec = null; consumed = 0; resultsLen = 0; clearTimeout(silenceTimer);
    if (interimEl) { interimEl.remove(); interimEl = null; }
    if (active) { try { startRec(); } catch (_) { active = false; setState('idle', 'Tap Start to keep talking.'); } }
  };
}
function startRec() { ensureRec(); if (!recRunning) { rec.start(); recRunning = true; } }
function stopRec() { active = false; clearTimeout(silenceTimer); if (rec) rec.abort(); }

function listen() {
  if (!active) return setState('idle');
  if (!SR) { setState('idle', 'Voice input needs Chrome, Edge or Safari. You can still type below.'); active = false; return; }
  consumed = resultsLen; lastHeard = '';              // drop anything heard while Hector was talking
  setState('listening');
  try { startRec(); } catch (_) { /* already running */ }
}

const voice = t => fetch('https://n8n.srv1508505.hstgr.cloud/webhook/hector-voice', { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ id: t }) }).then(r => { if (!r.ok) throw new Error('voice failed'); return r.blob(); });

function play(blob) {
  return new Promise(resolve => {
    audio = player;
    player.onended = player.onpause = () => resolve();
    player.src = URL.createObjectURL(blob);
    player.play().catch(err => {
      statusEl.textContent = 'Tap the circle to hear Hector (your browser blocked the sound).';
      resolve();
    });
  });
}

async function talk(text) {
  const my = ++turn;                         // a newer turn cancels this one
  add('me', text); setState('thinking');
  const t0 = performance.now();
  try {
    const r = await fetch('https://n8n.srv1508505.hstgr.cloud/webhook/hector-think', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, history }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    if (my !== turn) return;
    history.push({ role: 'user', content: text }, { role: 'assistant', content: d.reply });
    history = history.slice(-12);
    const bubble = add('him', d.reply);
    // Voice every sentence at once, play them in order: the first one starts as soon as it's ready.
    const clips = (d.clips || []).map(voice);
    for (let i = 0; i < clips.length; i++) {
      const blob = await clips[i];
      if (i === 0) { const s = document.createElement('small'); s.textContent = `first words after ${((performance.now() - t0) / 1000).toFixed(1)}s`; bubble.appendChild(s); setState('speaking'); }
      if (my !== turn || state !== 'speaking') break;   // interrupted
      await play(blob);
      if (my !== turn || state !== 'speaking') break;
    }
  } catch (err) {
    add('err', 'Error: ' + err.message);
  }
  if (my !== turn) return;
  audio = null;
  if (state === 'speaking' || state === 'thinking') active ? listen() : setState('idle');
}

orb.onclick = () => {
  unlockAudio();
  if (state === 'speaking') { active = true; setState('listening'); audio && audio.pause(); return listen(); }
  if (state === 'idle') { active = true; return listen(); }
  stopRec(); setState('idle');   // tap while listening = stop
};
document.getElementById('typed').onsubmit = e => {
  e.preventDefault(); unlockAudio(); const t = document.getElementById('text'); const v = t.value.trim();
  if (!v || state === 'thinking') return; t.value = '';
  if (audio) { audio.pause(); audio = null; }
  talk(v);
};
setState('idle');
document.addEventListener('visibilitychange', () => {   // stop listening when the tab is hidden
  if (document.hidden && active) { stopRec(); if (audio) audio.pause(); setState('idle'); }
});
</script>
</body>
</html>
